apiVersion: v1
kind: Service
metadata:
  name: securenexus-backend-service
spec:
  type: ClusterIP
  selector:
    app: securenexus-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: torchserve-service
spec:
  type: ClusterIP
  selector:
    app: torchserve
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
